version: '3.8'

services:
  # Primary Database: PostgreSQL 16
  postgres:
    image: postgres:16-alpine
    container_name: antigravity-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-antigravity_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-antigravity_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-antigravity_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-antigravity_admin} -d ${POSTGRES_DB:-antigravity_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # In-Memory Queue & Cache: Redis 7
  redis:
    image: redis:7-alpine
    container_name: antigravity-redis
    restart: always
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-antigravity_redis_pass}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-antigravity_redis_pass}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Database GUI: pgAdmin 4 (Development / Ops triage)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: antigravity-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@taazitokari.in}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_lucknow_2026}
    ports:
      - "5050:80"
    depends_on:
      - postgres

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
